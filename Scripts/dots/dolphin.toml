[nemo]
    action = "sync"
    description = "KDE File Manager"
    owner = "The HyDE Project"
    version = "0.1.0"


[[nemo.dependency]]
    dnf = [ "nemo" ]
    pacman = [ "nemo" ]


[[nemo.files]]    
    paths = [
    ".config/nemorc",
    ".local/share/nemo",
    ".local/share/kio/servicemenus/shadewallpaper.desktop",
    ".local/share/kxmlgui5/nemo",
    ]
    source_root = "Configs"
    target_root = "${HOME}"


[[nemo.files]]
    action = "preserve"
    paths = "nemostaterc"
    source_root = "Configs/.local/state"
    target_root = "${HOME}/.local/state"



[[nemo.files]]
    action = "sync"
    paths = "applications.menu"
    source_root = "Configs/.config/menus"
    target_root = "${XDG_CONFIG_HOME}/menus" 